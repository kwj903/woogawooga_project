{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>분석 진행 중 - WOOGAWOOGA</title>
    <link rel="stylesheet" href="{% static 'voice_phishing/css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <svg class="shield-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                <h1 class="header-title">woogawooga</h1>
            </div>
            <div class="breadcrumb">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span id="breadcrumb-text">분석 진행</span>
            </div>
        </div>

        <div class="main-content">
            <!-- Analysis Screen -->
            <div id="analysis-screen" class="card">
                <div class="card-header">
                    <h2 class="card-title">보이스피싱 분석 진행 중</h2>
                    <p class="card-description">
                        작업 ID: <span id="taskId">-</span>
                    </p>
                </div>
                <div class="card-content">
                    <!-- 분석 단계 표시 -->
                    <div id="analysisSteps" class="analysis-steps">
                        <div class="step">
                            <div class="step-icon">
                                <i class="fas fa-microphone step-pending"></i>
                            </div>
                            <div class="step-content">
                                <div class="step-title">STT 변환</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 0%"></div>
                                </div>
                                <div class="progress-percent">0%</div>
                            </div>
                        </div>

                        <div class="step">
                            <div class="step-icon">
                                <i class="fas fa-brain step-pending"></i>
                            </div>
                            <div class="step-content">
                                <div class="step-title">1차 ML 분석</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 0%"></div>
                                </div>
                                <div class="progress-percent">0%</div>
                            </div>
                        </div>

                        <div class="step">
                            <div class="step-icon">
                                <i class="fas fa-robot step-pending"></i>
                            </div>
                            <div class="step-content">
                                <div class="step-title">2차 DL 분석</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 0%"></div>
                                </div>
                                <div class="progress-percent">0%</div>
                            </div>
                        </div>

                        <div class="step">
                            <div class="step-icon">
                                <i class="fas fa-comments step-pending"></i>
                            </div>
                            <div class="step-content">
                                <div class="step-title">LLM 메시지 생성</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 0%"></div>
                                </div>
                                <div class="progress-percent">0%</div>
                            </div>
                        </div>
                    </div>

                    <!-- 현재 상태 메시지 -->
                    <div class="status-section">
                        <div class="status-message">
                            <i class="fas fa-info-circle"></i>
                            <span id="currentStatus">분석을 준비하고 있습니다...</span>
                        </div>
                    </div>

                    <!-- 오류 섹션 (숨김) -->
                    <div id="errorSection" class="error-section" style="display: none;">
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span>분석 중 오류가 발생했습니다.</span>
                        </div>
                        <button class="retry-btn" onclick="retryAnalysis()">
                            <i class="fas fa-redo"></i>
                            다시 시도
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script src="{% static 'js/analysis.js' %}"></script>
</body>
</html>
