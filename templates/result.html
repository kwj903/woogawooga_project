{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 결과 - 보이스피싱 탐지 시스템</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 네비게이션 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-content">
                <a href="{% url 'woogawooga:index' %}" class="nav-logo">
                    <i class="fas fa-shield-alt"></i>
                    <span>보이스피싱 판단 시스템</span>
                </a>
                
                <div class="nav-menu desktop-menu">
                    <a href="{% url 'woogawooga:index' %}" class="nav-link">홈</a>
                    <a href="{% url 'woogawooga:upload' %}" class="nav-link">업로드</a>
                </div>
                
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <div class="mobile-menu" id="mobileMenu">
                <a href="{% url 'woogawooga:index' %}" class="mobile-nav-link">홈</a>
                <a href="{% url 'woogawooga:upload' %}" class="mobile-nav-link">업로드</a>
            </div>
        </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="container result-container">
            <!-- 헤더 -->
            <div class="page-header">
                <h1>분석 결과</h1>
            </div>

            <!-- 로딩 상태 -->
            <div class="loading-section" id="loadingSection">
                <div class="loading-spinner"></div>
                <p>결과를 불러오는 중...</p>
            </div>

            <!-- 오류 상태 -->
            <div class="error-result" id="errorResult" style="display: none;">
                <div class="card">
                    <div class="card-content error-content">
                        <i class="fas fa-exclamation-triangle error-icon"></i>
                        <h3>서버/분석 오류 메시지</h3>
                        <p id="errorMessage">서버/분석 오류가 발생했습니다.</p>
                        <button class="btn btn-primary" onclick="retryAnalysis()">다시 시도</button>
                    </div>
                </div>
            </div>

            <!-- 결과 카드 -->
            <div class="card result-card" id="resultCard" style="display: none;">
                <div class="card-header">
                    <h3 class="card-title">보이스피싱 분석 결과</h3>
                    <p class="card-description">1차 2차 연동 탐지 결과입니다</p>
                </div>
                
                <div class="card-content">
                    <!-- 최종 결과 배지 -->
                    <div class="result-badge-container">
                        <div class="result-badge" id="resultBadge">
                            <i class="fas fa-shield-alt"></i>
                            <span id="resultText">분석 중...</span>
                        </div>
                    </div>

                    <!-- 상세 정보 -->
                    <div class="result-details">
                        <div class="detail-row">
                            <span class="detail-label">■ 최종 결과:</span>
                            <span class="detail-value" id="finalResult">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">■ 유형:</span>
                            <span class="detail-value" id="phishingType">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">■ 신뢰도:</span>
                            <span class="detail-value" id="confidence">-</span>
                        </div>
                    </div>

                    <!-- 경고 메시지 -->
                    <div class="warning-message" id="warningMessage">
                        <h3>■ 경고 메시지:</h3>
                        <p id="warningText">분석 결과를 기다리는 중입니다...</p>
                    </div>

                    <!-- 액션 버튼 -->
                    <div class="button-group">
                        <button class="btn btn-primary btn-large" onclick="retryAnalysis()">
                            <i class="fas fa-redo"></i>
                            다시 분석
                        </button>
                        <button class="btn btn-outline btn-large" onclick="goHome()">
                            <i class="fas fa-home"></i>
                            홈으로
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{% static 'js/script.js' %}"></script>
    <script src="{% static 'js/result.js' %}"></script>
</body>
</html>
